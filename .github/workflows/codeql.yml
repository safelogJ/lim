name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '43 14 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5 # Обновили до v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4 # Обновили до v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug :limserver:minifyJar

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4 # Обновили до v4
      with:
        category: "/language:${{matrix.language}}"
