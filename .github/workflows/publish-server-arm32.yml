name: Publish Lim Server ARM32

on:
  push:
    branches: [ "master" ]
    paths:
      - 'limserver/build.gradle.kts'
  workflow_dispatch:

jobs:
  build-and-push-arm32:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Minified Jar
        run: ./gradlew :limserver:minifyJar

      - name: Extract version from Gradle
        id: get_version
        run: |
          VERSION=$(./gradlew :limserver:properties | grep ^version: | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM32 Image
        uses: docker/build-push-action@v7
        with:
          context: ./limserver
          file: ./limserver/docker32
          platforms: linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/safelogj/lim-server:latest-arm32
            ghcr.io/safelogj/lim-server:arm32
            ghcr.io/safelogj/lim-server:${{ steps.get_version.outputs.VERSION }}-arm32
