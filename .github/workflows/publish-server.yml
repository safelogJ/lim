name: Publish Lim Server Multi-Arch

on:
  push:
    branches: [ "master" ]
    paths:
      - 'limserver/**'
      - '.github/workflows/publish-server.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Minified Jar
        run: ./gradlew :limserver:minifyJar

      - name: Extract version from Gradle
        id: get_version
        run: |
          # Вытаскиваем версию из build.gradle.kts сервера
          VERSION=$(./gradlew :limserver:properties | grep ^version: | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: ./limserver
          platforms: linux/amd64,linux/arm64
          push: true
          # Отключаем создание лишних метаданных, которые создают unknown/unknown
          provenance: false
          tags: |
            ghcr.io/safelogj/lim-server:latest
            ghcr.io/safelogj/lim-server:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/safelogj/lim-server:${{ github.sha }}
