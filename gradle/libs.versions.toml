[versions]
agp = "9.3.2"
shadow = "9.6.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
documentfile = "1.1.0"
logbackClassic = "1.6.3"
