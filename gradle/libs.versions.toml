workruntime = { group = "androidx.work", name = "work-runtime", version.ref = "workRuntime" }
desugar = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
concentus = { group = "io.github.jaredmdobson", name = "concentus", version.ref = "concentus" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }


